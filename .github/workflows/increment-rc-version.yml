name: Increment RC Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version (e.g., 0.5.0)'
        required: true
        type: string
      fix_description:
        description: 'Description of fixes in this RC increment'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  increment-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: integration
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find next RC number
        id: rc-number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Trouver le dernier RC pour cette version
          LAST_RC=$(git tag -l "v${VERSION}-rc*" | sort -V | tail -1)

          if [ -z "$LAST_RC" ]; then
            echo "❌ Aucun RC trouvé pour v${VERSION}"
            echo "Utilisez d'abord le workflow 'Prepare Release Candidate'"
            exit 1
          fi

          # Extraire le numéro du dernier RC
          LAST_RC_NUM=$(echo "$LAST_RC" | grep -oP 'rc\K\d+')
          NEXT_RC_NUM=$((LAST_RC_NUM + 1))

          echo "last_rc=$LAST_RC" >> $GITHUB_OUTPUT
          echo "next_rc_num=$NEXT_RC_NUM" >> $GITHUB_OUTPUT
          echo "next_rc_tag=v${VERSION}-rc${NEXT_RC_NUM}" >> $GITHUB_OUTPUT

          echo "📊 Dernier RC: $LAST_RC"
          echo "📊 Prochain RC: v${VERSION}-rc${NEXT_RC_NUM}"

      - name: Build updated release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          LAST_RC: ${{ steps.rc-number.outputs.last_rc }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
        run: |
          # Prefer previous GitHub release notes, but tolerate a missing release when only the tag exists.
          PREV_NOTES=$(gh release view "$LAST_RC" --json body --jq '.body' 2>/dev/null || true)

          if [ -z "$PREV_NOTES" ]; then
            CHANGELOG_CONTENT=$(awk '/^## \[Unreleased\]$/{flag=1;next} flag && /^## \[/{flag=0} flag{print}' CHANGELOG.md | sed '/./,$!d')

            {
              echo "## 🧪 Release Candidate"
              echo ""
              echo "Cette version est une **release candidate** destinée aux tests en production et aux beta-testeurs."
              echo ""
              if [ -n "$CHANGELOG_CONTENT" ]; then
                echo "$CHANGELOG_CONTENT"
                echo ""
              else
                echo "> ℹ️ Notes initiales indisponibles : reconstruction à partir de l'état courant de la branche integration."
                echo ""
              fi
              echo "---"
            } > /tmp/prev-rc-notes.md
            PREV_NOTES=$(cat /tmp/prev-rc-notes.md)
          fi

          {
            echo "$PREV_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "## 🔧 RC ${RC_NUM} - $(date +%Y-%m-%d)"
            echo ""
            echo "$FIX_DESCRIPTION"
          } > /tmp/new-rc-notes.md
          echo "✅ Notes de version mises à jour"

      - name: Create new RC tag
        env:
          VERSION: ${{ inputs.version }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
        run: |
          git tag -a "$NEXT_RC_TAG" -m "Release Candidate v${VERSION}-rc${RC_NUM}" -m "Corrections apportées:" -m "$FIX_DESCRIPTION"

          git push origin "$NEXT_RC_TAG"

      - name: Delete previous RC release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_RC: ${{ steps.rc-number.outputs.last_rc }}
        run: |
          # Supprimer l'ancienne pre-release (mais garder le tag pour l'historique)
          gh release delete "$LAST_RC" --yes 2>/dev/null || true

      - name: Create new GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
        run: |
          gh release create "$NEXT_RC_TAG" \
            --title "🧪 v${VERSION}-rc${RC_NUM} - Release Candidate" \
            --notes-file /tmp/new-rc-notes.md \
            --prerelease \
            --target integration

      - name: Find and update tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
          RELEASE_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          # Chercher l'issue de tracking
          ISSUE_NUMBER=$(gh issue list \
            --label "release-candidate" \
            --search "RC Testing: v${VERSION}" \
            --json number \
            --jq '.[0].number')

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "## 🔄 Nouveau RC disponible: rc${RC_NUM}

            **Tag:** \`$NEXT_RC_TAG\`

            ### Corrections apportées
            $FIX_DESCRIPTION

            ### 🔗 Lien
            [Pre-Release GitHub]($RELEASE_URL_BASE/$NEXT_RC_TAG)

            Merci de tester cette nouvelle version et de signaler tout problème dans cette issue."
          fi

      - name: Summary
        env:
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
          LAST_RC: ${{ steps.rc-number.outputs.last_rc }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
        run: |
          echo "## ✅ Nouvelle Release Candidate créée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$NEXT_RC_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Précédent:** \`$LAST_RC\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Corrections" >> $GITHUB_STEP_SUMMARY
          echo "$FIX_DESCRIPTION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Prochaines étapes" >> $GITHUB_STEP_SUMMARY
          echo "1. Testez la nouvelle RC" >> $GITHUB_STEP_SUMMARY
          echo "2. Si autres corrections nécessaires → relancer ce workflow" >> $GITHUB_STEP_SUMMARY
          echo "3. Si tout OK → créer PR \`integration\` → \`main\` pour release finale" >> $GITHUB_STEP_SUMMARY
